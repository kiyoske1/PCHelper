[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-helper"
version = "1.1.0"
description = "A lightweight local-first Windows utility toolkit."
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2.2", "psutil>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
