name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PC-Helper main.py

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: cmd
        run: |
          copy dist\PC-Helper.exe installer\dist\PC-Helper.exe
          makensis installer\PC-Helper.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PC-Helper-Windows
          path: |
            dist/PC-Helper.exe
            installer/PC-Helper-Setup.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PC-Helper.exe
            installer/PC-Helper-Setup.exe
          generate_release_notes: true
