name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Verify code
        run: |
          python -m pytest
          ruff check .

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PC-Helper main.py

      - name: Prepare installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/dist | Out-Null
          Copy-Item dist/PC-Helper.exe installer/dist/PC-Helper.exe -Force

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: cmd
        run: makensis installer\PC-Helper.nsi

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PC-Helper.exe")) { throw "Executable was not created" }
          if (!(Test-Path "installer/PC-Helper-Setup.exe")) { throw "Installer was not created" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PC-Helper-Windows
          path: |
            dist/PC-Helper.exe
            installer/PC-Helper-Setup.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PC-Helper.exe
            installer/PC-Helper-Setup.exe
          generate_release_notes: true
